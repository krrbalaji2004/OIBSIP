<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
    <header>
        <h1 id="user">Temperature convertor</h1>
        <p id="user">Convert Temperature between Celisus, Fahrenheit and kelvin.</p>
        <form class="form">
            <label>Enter Temperature</label>
            <input type="number" placeholder="Enter temperature"><br>
            <label>Select Input Unit</label>
            <select>
                <option value="Celsius">Celsius (°C)</option>
                <option value="Fahrenheit">Fahrenheit (°F)</option>
                <option value="Kelvin">Kelvin (K)</option>
            </select><br>
            <button type="button" onclick="convert()">Convert</button>
            <p id="error"></p>
        </form>
    </header>
    <section class="rest">
        <h3>Results</h3>
        <p id="cel">Celsius: - </p>
        <p id="faren">Fahrenheit: - </p>
        <p id="kelvin">Kelvin: - </p>
    </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
