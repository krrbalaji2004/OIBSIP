name: Deploy TechNova Landing Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Website
        run: |
          mkdir -p public
          cp "Web Development Level 1 Landing Page/index.html" public/index.html
          cp "Web Development Level 1 Landing Page/style.css" public/style.css

      - name: Check Website Files
        run: |
          echo "Files inside public:"
          ls -la public
          echo "Checking index.html:"
          head -20 public/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
